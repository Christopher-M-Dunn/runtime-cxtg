<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1180" width="1500" height="1180" font-family="monospace, Consolas, 'Courier New'">

  <!-- Background -->
  <rect width="1500" height="1180" fill="#1e1e2e"/>

  <!-- Legend -->
  <rect x="20" y="20" width="220" height="110" rx="6" fill="#2a2a3e" stroke="#555" stroke-width="1"/>
  <text x="30" y="40" fill="#ccc" font-size="11" font-weight="bold">LEGEND</text>
  <rect x="30" y="50" width="14" height="14" rx="3" fill="#2d5a27"/>
  <text x="50" y="62" fill="#aaa" font-size="11">Auto-generated by build system</text>
  <rect x="30" y="72" width="14" height="14" rx="3" fill="#5a4a10"/>
  <text x="50" y="84" fill="#aaa" font-size="11">Partially automated (you declare,</text>
  <text x="50" y="96" fill="#aaa" font-size="11">system generates wrappers)</text>
  <rect x="30" y="104" width="14" height="14" rx="3" fill="#5a1a1a"/>
  <text x="50" y="116" fill="#aaa" font-size="11">Fully manual</text>

  <!-- ============================================================ -->
  <!-- ROW 0: Build entry -->
  <!-- ============================================================ -->
  <rect x="550" y="20" width="400" height="65" rx="8" fill="#1a3a5a" stroke="#4a8abf" stroke-width="2"/>
  <text x="750" y="44" fill="#7ec8e3" font-size="13" font-weight="bold" text-anchor="middle">BUILD ENTRY</text>
  <text x="750" y="62" fill="#aac" font-size="10" text-anchor="middle">./configure --target-list=riscv64-softmmu,riscv32-softmmu</text>
  <text x="750" y="76" fill="#888" font-size="10" text-anchor="middle">Produces separate binary per target (TARGET_RISCV32 / TARGET_RISCV64)</text>

  <!-- Arrow: entry → meson -->
  <line x1="750" y1="85" x2="750" y2="115" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- ROW 1: Meson -->
  <!-- ============================================================ -->
  <rect x="480" y="116" width="540" height="90" rx="8" fill="#2d5a27" stroke="#5a9e50" stroke-width="2"/>
  <text x="750" y="138" fill="#90ee90" font-size="13" font-weight="bold" text-anchor="middle">MESON BUILD SYSTEM</text>
  <text x="750" y="155" fill="#cfc" font-size="10" text-anchor="middle">target/riscv/meson.build</text>
  <text x="750" y="170" fill="#aec" font-size="10" text-anchor="middle">riscv_ss.add(files('cx.c', ...))   ← shared, compiled per target</text>
  <text x="750" y="185" fill="#aec" font-size="10" text-anchor="middle">riscv_system_ss.add(...)           ← system-mode only</text>
  <text x="750" y="198" fill="#888" font-size="9" text-anchor="middle">trans_*.c.inc NOT listed here — they are #included into translate.c directly</text>

  <!-- Arrows: meson → three subsystems -->
  <line x1="600" y1="206" x2="270" y2="280" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="206" x2="750" y2="280" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="900" y1="206" x2="1230" y2="280" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- ROW 2: Three parallel subsystems -->
  <!-- ============================================================ -->

  <!-- LEFT: Decodetree -->
  <rect x="30" y="280" width="470" height="230" rx="8" fill="#2d5a27" stroke="#5a9e50" stroke-width="2"/>
  <text x="265" y="302" fill="#90ee90" font-size="13" font-weight="bold" text-anchor="middle">DECODETREE</text>
  <text x="265" y="318" fill="#cfc" font-size="10" text-anchor="middle">scripts/decodetree.py</text>

  <text x="40" y="340" fill="#aec" font-size="10">Input files (you write):</text>
  <text x="50" y="354" fill="#9dc" font-size="10">• target/riscv/insn32.decode</text>
  <text x="50" y="368" fill="#9dc" font-size="10">• target/riscv/insn16.decode</text>
  <text x="50" y="382" fill="#9dc" font-size="10">• target/riscv/xthead.decode  (vendor)</text>

  <text x="40" y="400" fill="#aec" font-size="10">Generated at build time → build/.../*.c.inc:</text>
  <text x="50" y="414" fill="#7b7" font-size="10">• arg struct typedefs  (arg_r2, arg_i, ...)</text>
  <text x="50" y="428" fill="#7b7" font-size="10">• bit-extract functions per format</text>
  <text x="50" y="442" fill="#7b7" font-size="10">• decode_insn32() dispatch tree</text>
  <text x="50" y="456" fill="#7b7" font-size="10">  → calls trans_NAME(ctx, &amp;arg)  automatically</text>

  <text x="40" y="474" fill="#aec" font-size="10">Naming convention:</text>
  <text x="50" y="488" fill="#9dc" font-size="10">@r2 → format; &amp;r2 → arg struct; trans_cxsetsel() ← wired by name</text>
  <text x="50" y="500" fill="#555" font-size="9">Width: same .decode → same dispatch for RV32/64/128 (TCG handles width)</text>

  <!-- MIDDLE: DEF_HELPER_N -->
  <rect x="515" y="280" width="470" height="230" rx="8" fill="#5a4a10" stroke="#c8a84a" stroke-width="2"/>
  <text x="750" y="302" fill="#ffd77a" font-size="13" font-weight="bold" text-anchor="middle">DEF_HELPER_N MACRO SYSTEM</text>
  <text x="750" y="318" fill="#eec" font-size="10" text-anchor="middle">X-macro 3-pass include trick</text>

  <text x="525" y="340" fill="#dca" font-size="10">You write (1 line in helper.h):</text>
  <text x="535" y="354" fill="#fc9" font-size="10">DEF_HELPER_2(cxsetsel, tl, env, tl)</text>

  <text x="525" y="372" fill="#dca" font-size="10">Pass 1 — helper-proto.h:</text>
  <text x="535" y="386" fill="#fb8" font-size="10">→ target_ulong helper_cxsetsel(CPURISCVState*, target_ulong)</text>

  <text x="525" y="404" fill="#dca" font-size="10">Pass 2 — helper-gen.h (used in translate.c TU):</text>
  <text x="535" y="418" fill="#fb8" font-size="10">→ static inline void gen_helper_cxsetsel(TCGv dest,</text>
  <text x="535" y="432" fill="#fb8" font-size="10">    TCGv_ptr env, TCGv src)  { tcg_gen_call2(...); }</text>

  <text x="525" y="450" fill="#dca" font-size="10">You write (body in cx.c):</text>
  <text x="535" y="464" fill="#fc9" font-size="10">target_ulong helper_cxsetsel(CPURISCVState *env,</text>
  <text x="535" y="478" fill="#fc9" font-size="10">    target_ulong new_val) { ... }</text>

  <text x="525" y="498" fill="#888" font-size="9">Type tl = target_ulong = XLEN bits (32 in RV32 build, 64 in RV64 build)</text>

  <!-- RIGHT: ISA Registration -->
  <rect x="1000" y="280" width="470" height="230" rx="8" fill="#5a4a10" stroke="#c8a84a" stroke-width="2"/>
  <text x="1235" y="302" fill="#ffd77a" font-size="13" font-weight="bold" text-anchor="middle">ISA EXTENSION REGISTRATION</text>
  <text x="1235" y="318" fill="#eec" font-size="10" text-anchor="middle">Pipeline from struct field → user-visible -cpu flag</text>

  <text x="1010" y="340" fill="#dca" font-size="10">Step 1 — declare field (cpu_cfg_fields.h.inc):</text>
  <text x="1020" y="354" fill="#fc9" font-size="10">BOOL_FIELD(ext_zcx)</text>
  <text x="1020" y="368" fill="#7b7" font-size="9">→ auto-expands into RISCVCPUConfig struct</text>

  <text x="1010" y="386" fill="#dca" font-size="10">Step 2 — register property (cpu.c):</text>
  <text x="1020" y="400" fill="#fc9" font-size="10">MULTI_EXT_CFG_BOOL("zcx", ext_zcx, false)</text>
  <text x="1020" y="414" fill="#7b7" font-size="9">→ getter/setter auto-generated; -cpu rv64,zcx=on works</text>

  <text x="1010" y="432" fill="#dca" font-size="10">Step 3 — ISA string (cpu.c):</text>
  <text x="1020" y="446" fill="#fc9" font-size="10">ISA_EXT_DATA_ENTRY(zcx, PRIV_VERSION_1_10_0, ext_zcx)</text>
  <text x="1020" y="460" fill="#7b7" font-size="9">→ appears in ISA string output</text>

  <text x="1010" y="478" fill="#dca" font-size="10">Step 4 — KVM sync (kvm/kvm-cpu.c, optional):</text>
  <text x="1020" y="492" fill="#fc9" font-size="10">KVM_EXT_CFG("zcx", ext_zcx, KVM_RISCV_ISA_EXT_ZCX)</text>
  <text x="1020" y="506" fill="#7b7" font-size="9">→ syncs QEMU config ↔ KVM kernel capabilities</text>

  <!-- Arrows: three subsystems → translate.c -->
  <line x1="265" y1="510" x2="550" y2="600" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="510" x2="750" y2="600" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1235" y1="510" x2="950" y2="600" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- ROW 3: translate.c — convergence point -->
  <!-- ============================================================ -->
  <rect x="390" y="600" width="720" height="135" rx="8" fill="#2a2050" stroke="#8870d0" stroke-width="2"/>
  <text x="750" y="622" fill="#c0a8ff" font-size="13" font-weight="bold" text-anchor="middle">translate.c  —  CONVERGENCE POINT (single TU)</text>
  <text x="750" y="640" fill="#aba" font-size="10" text-anchor="middle">All .c.inc files are #included here; decodetree output and gen_helper_* are all accessible</text>

  <text x="400" y="662" fill="#9a9" font-size="10">#include "decode-insn32.c.inc"        ← decodetree output (generated)</text>
  <text x="400" y="676" fill="#9a9" font-size="10">#include "insn_trans/trans_rvi.c.inc"  ← contains do_csr_post() static fn</text>
  <text x="400" y="690" fill="#9a9" font-size="10">#include "insn_trans/trans_rvzcx.c.inc" ← our new file; trans_cxsetsel()</text>
  <text x="400" y="704" fill="#9a9" font-size="10">#include "exec/helper-gen.h"           ← gen_helper_cxsetsel() inline wrapper</text>

  <text x="750" y="726" fill="#776699" font-size="10" text-anchor="middle">Width selection: TARGET_RISCV32 → always MXL_RV32  |  TARGET_RISCV64 → ctx-&gt;xl ∈ {RV32, RV64, RV128} at runtime</text>
  <text x="750" y="740" fill="#554477" font-size="9" text-anchor="middle">TCGv = 64-bit slot in both builds  |  tl = target_ulong (XLEN bits at compile time)  |  RV128 uses paired TCGv (cpu_gpr + cpu_gprh)</text>

  <!-- Arrows: translate.c → lower three -->
  <line x1="500" y1="735" x2="200" y2="810" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="750" y1="735" x2="750" y2="810" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="1000" y1="735" x2="1300" y2="810" stroke="#555" stroke-width="2" marker-end="url(#arr)"/>

  <!-- ============================================================ -->
  <!-- ROW 4: Three independent systems -->
  <!-- ============================================================ -->

  <!-- LEFT: Trace Events -->
  <rect x="30" y="810" width="390" height="165" rx="8" fill="#2d5a27" stroke="#5a9e50" stroke-width="2"/>
  <text x="225" y="832" fill="#90ee90" font-size="13" font-weight="bold" text-anchor="middle">TRACE EVENT SYSTEM</text>
  <text x="225" y="848" fill="#cfc" font-size="10" text-anchor="middle">target/riscv/trace-events</text>

  <text x="40" y="870" fill="#aec" font-size="10">You write (1 line per event):</text>
  <text x="50" y="884" fill="#9dc" font-size="10">cxsetsel(uint64_t hartid, uint64_t new_val,</text>
  <text x="50" y="898" fill="#9dc" font-size="10">    uint64_t old_val) "hart=%" PRId64 " ..."</text>

  <text x="40" y="916" fill="#aec" font-size="10">Build system generates:</text>
  <text x="50" y="930" fill="#7b7" font-size="10">→ trace/generated-events.h</text>
  <text x="50" y="944" fill="#7b7" font-size="10">→ trace_cxsetsel(hartid, new_val, old_val)</text>
  <text x="50" y="958" fill="#7b7" font-size="10">   callable anywhere in cx.c</text>

  <text x="40" y="972" fill="#555" font-size="9">Compiled out to zero cost if tracing disabled</text>

  <!-- MIDDLE: KVM mapping -->
  <rect x="455" y="810" width="590" height="165" rx="8" fill="#5a4a10" stroke="#c8a84a" stroke-width="2"/>
  <text x="750" y="832" fill="#ffd77a" font-size="13" font-weight="bold" text-anchor="middle">KVM EXTENSION MAPPING</text>
  <text x="750" y="848" fill="#eec" font-size="10" text-anchor="middle">target/riscv/kvm/kvm-cpu.c  (optional — TCG works without this)</text>

  <text x="465" y="870" fill="#dca" font-size="10">You write (in kvm_multi_ext_cfgs[] array):</text>
  <text x="475" y="884" fill="#fc9" font-size="10">KVM_EXT_CFG("zcx", ext_zcx, KVM_RISCV_ISA_EXT_ZCX)</text>

  <text x="465" y="902" fill="#dca" font-size="10">Automation handles:</text>
  <text x="475" y="916" fill="#7b7" font-size="10">→ bidirectional sync QEMU cfg ↔ KVM ioctl</text>
  <text x="475" y="930" fill="#7b7" font-size="10">→ kvm_cpu_get/set_multi_ext_cfg() loops over array</text>

  <text x="465" y="950" fill="#888" font-size="10">Required only if KVM kernel supports the extension.</text>
  <text x="465" y="964" fill="#888" font-size="10">Omit if not yet in upstream KVM; TCG path unaffected.</text>
  <text x="465" y="978" fill="#555" font-size="9">Check linux-headers/asm-riscv/kvm.h for KVM_RISCV_ISA_EXT_* constants</text>

  <!-- RIGHT: Disassembler -->
  <rect x="1080" y="810" width="400" height="165" rx="8" fill="#5a1a1a" stroke="#c05050" stroke-width="2"/>
  <text x="1280" y="832" fill="#ff8080" font-size="13" font-weight="bold" text-anchor="middle">DISASSEMBLER</text>
  <text x="1280" y="848" fill="#faa" font-size="10" text-anchor="middle">disas/riscv.c  ← FULLY MANUAL</text>
  <text x="1280" y="862" fill="#c88" font-size="10" text-anchor="middle">NOT connected to decodetree</text>

  <text x="1090" y="882" fill="#f88" font-size="10">Three manual additions required:</text>
  <text x="1100" y="896" fill="#faa" font-size="10">1. Enum:  rv_op_cxsetsel = 956,</text>
  <text x="1100" y="910" fill="#faa" font-size="10">2. List:  { "cxsetsel", rv_codec_r,</text>
  <text x="1100" y="924" fill="#faa" font-size="10">           rv_fmt_rd_rs1, NULL, 0, 0, 0 },</text>
  <text x="1100" y="938" fill="#faa" font-size="10">3. Decode: case 4: (funct3=4) add</text>
  <text x="1100" y="952" fill="#faa" font-size="10">   ext_zcx + (inst&gt;&gt;20)==0 check</text>

  <text x="1090" y="970" fill="#a55" font-size="9">Changes to .decode files do NOT update this.</text>
  <text x="1090" y="982" fill="#a55" font-size="9">Must be maintained separately by hand.</text>

  <!-- ============================================================ -->
  <!-- ROW 5: Summary table -->
  <!-- ============================================================ -->
  <rect x="30" y="1000" width="1450" height="158" rx="8" fill="#1a1a2e" stroke="#444" stroke-width="1"/>
  <text x="755" y="1020" fill="#aaa" font-size="12" font-weight="bold" text-anchor="middle">WHAT TO TOUCH FOR COMMON CHANGES</text>

  <!-- Header row -->
  <rect x="40" y="1028" width="440" height="18" rx="2" fill="#252535"/>
  <rect x="490" y="1028" width="480" height="18" rx="2" fill="#252535"/>
  <rect x="980" y="1028" width="490" height="18" rx="2" fill="#252535"/>
  <text x="260" y="1041" fill="#888" font-size="10" font-weight="bold" text-anchor="middle">CHANGE TYPE</text>
  <text x="730" y="1041" fill="#888" font-size="10" font-weight="bold" text-anchor="middle">FILES TO TOUCH</text>
  <text x="1225" y="1041" fill="#888" font-size="10" font-weight="bold" text-anchor="middle">AUTO-GENERATED FOR YOU</text>

  <text x="50" y="1060" fill="#9dc" font-size="10">New instruction (RV32/64)</text>
  <text x="500" y="1060" fill="#ccc" font-size="10">insn32.decode, insn_trans/trans_X.c.inc, helper.h, cx.c, disas/riscv.c</text>
  <text x="990" y="1060" fill="#7b7" font-size="10">arg struct, dispatch, gen_helper_* wrapper, TCG call glue</text>

  <text x="50" y="1076" fill="#9dc" font-size="10">New extension flag</text>
  <text x="500" y="1076" fill="#ccc" font-size="10">cpu_cfg_fields.h.inc, cpu.c (×2: MULTI_EXT + ISA_EXT), kvm-cpu.c</text>
  <text x="990" y="1076" fill="#7b7" font-size="10">QOM property getter/setter, -cpu flag parsing, ISA string output</text>

  <text x="50" y="1092" fill="#9dc" font-size="10">New helper function</text>
  <text x="500" y="1092" fill="#ccc" font-size="10">helper.h (DEF_HELPER_N), cx.c (body)</text>
  <text x="990" y="1092" fill="#7b7" font-size="10">gen_helper_*() inline TCG wrapper, C prototype, ABI glue</text>

  <text x="50" y="1108" fill="#9dc" font-size="10">New trace point</text>
  <text x="500" y="1108" fill="#ccc" font-size="10">trace-events (1 line)</text>
  <text x="990" y="1108" fill="#7b7" font-size="10">trace_*() callable function, conditional no-op if tracing off</text>

  <text x="50" y="1124" fill="#9dc" font-size="10">New .c source file</text>
  <text x="500" y="1124" fill="#ccc" font-size="10">target/riscv/meson.build (riscv_ss.add)</text>
  <text x="990" y="1124" fill="#7b7" font-size="10">Compiled into both riscv32 and riscv64 targets automatically</text>

  <text x="50" y="1140" fill="#f88" font-size="10">Disassembler update</text>
  <text x="500" y="1140" fill="#faa" font-size="10">disas/riscv.c — enum, opcode list, decode case  (all manual)</text>
  <text x="990" y="1140" fill="#a55" font-size="10">Nothing — fully manual, not tied to any other system</text>

  <text x="50" y="1156" fill="#9dc" font-size="10">trans_*.c.inc file</text>
  <text x="500" y="1156" fill="#ccc" font-size="10">translate.c (#include only) — do NOT add to meson.build</text>
  <text x="990" y="1156" fill="#7b7" font-size="10">Compiled as part of translate.c TU; do_csr_post() etc. accessible</text>

  <!-- Arrow markers definition -->
  <defs>
    <marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#555"/>
    </marker>
  </defs>

</svg>
